---
version: 2.1

description: |
  Reference orb for installing base PSK executor packages on ubuntu machine executor
  (or  other debian-based non-preconfigured executor).

  The GitHub organization for these resources has changed to twplatformlabs. Until further
  notice, the CircleCI org slug will remain twdps.

  Supported packages include:
  * 1Password CLI
  * Teller (v1.5.6)
  * Hashi Vault
  * Bats
  * Cosign
  * Grype
  * Hadolint
  * Oras
  * Snyk
  * Syft
  * Trivy

display:
  source_url: "https://github.com/twplatformlabs/orb-base-packages"
