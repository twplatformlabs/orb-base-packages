# src/examples/standard-workflow.yaml
# yamllint disable rule:line-length
---
description: Standard workflow demonstrating use of base-packages install.

usage:
  version: 2.1

  orbs:
    base-packages: twdps/base-packages@1.0.0

  jobs:

    my-machine-job:
      machine:
        image: ubuntu-2204:current
      resource_class: medium
      steps:
        - checkout
        - base-packages/install:
            cosign-version: 2.1.1  # can provide a version for any supported package
  
  workflows:

    circleci-docker-executor-build-pipeline:
      jobs:
        - my-machine-job
